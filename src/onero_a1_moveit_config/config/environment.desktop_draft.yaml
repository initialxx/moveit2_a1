# 桌面支架草案：可用于 sim，real 仅允许 allow_execution:=false 预览。
# 尚不能据此认定真实运动无碰撞。
# 用户提供的近似尺寸：桌面 1×1×0.03 m，深色底板厚 0.01 m，
# 支架总高约 0.40 m，机械臂根部安装中心距深色底板上表面约 0.35 m。
# 其余数值均在下方注明“估计”。校准所有尺寸/偏移后，另存实物配置，
# 再将 example_only 改为 false；不能仅改此标记就视为已校准。
example_only: false
mounting: humanoid_right
frame_id: world

# 单位：米、弧度。xyz 是各长方体中心，不是其上表面。
# world 原点与 base_link 原点重合，即机械臂根部安装面中心；Z 向上。
# humanoid_right 中 base_link 的 +Z 朝 world -Y，支架在根部的 +Y 侧。
# 示例假设支架中心与桌面中心对齐，位于 world [0, 0.08]（水平偏移估计）。
# 不含夹爪、另一只机械臂和线缆，且不放行任何环境接触对。
objects:
  - id: onero_env_table
    size: [1.0, 1.0, 0.03]
    xyz: [0.0, 0.08, -0.375]  # 桌面顶 -0.36；水平位置估计
    color: [0.70, 0.53, 0.31, 1.0]

  - id: onero_env_dark_plate
    # 长宽未知，草案先覆盖整个桌面；不能视为真实底板边界。
    size: [1.0, 1.0, 0.01]
    xyz: [0.0, 0.08, -0.355]  # 底板顶 -0.35
    color: [0.22, 0.22, 0.22, 1.0]

  - id: onero_env_stand_foot
    size: [0.18, 0.16, 0.02]  # 固定底座大小/厚度估计
    xyz: [0.0, 0.08, -0.34]
    color: [0.65, 0.67, 0.70, 1.0]

  - id: onero_env_column
    # 草案把 0.40 m 视为含 0.02 m 底座的总高，立柱净高暂按 0.38 m。
    size: [0.08, 0.08, 0.38]  # 截面宽/深估计
    xyz: [0.0, 0.08, -0.14]  # 底 -0.33，顶 +0.05
    color: [0.55, 0.58, 0.62, 1.0]

  - id: onero_env_mount_plate
    size: [0.12, 0.04, 0.14]  # 连接板包围盒大小/位置估计
    xyz: [0.0, 0.02, 0.0]
    color: [0.45, 0.48, 0.52, 1.0]
